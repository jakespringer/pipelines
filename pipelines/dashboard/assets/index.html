<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" href="/favicon.svg" type="image/svg+xml">

<body>

    <aside class="sidebar">

          <circle cx="12" cy="19" r="2.4"></circle>

        </svg>
        <span class="brand-name">pipelines</span>
      </a>

      <nav class="nav">
        <div class="nav-group">
          <div class="nav-label">Monitor</div>
          <a class="nav-item" href="#/" data-nav="runs">
            <svg class="nav-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="9" y1="6" x2="20" y2="6"></line><line x1="9" y1="12" x2="20" y2="12"></line>

          <a class="nav-item" href="#/all" data-nav="all">

              <path d="M12 3 21 7.5 12 12 3 7.5 12 3z"></path>
              <path d="M3 12l9 4.5L21 12"></path><path d="M3 16.5 12 21l9-4.5"></path>
            </svg>
            <span>All runs</span>
          </a>
        </div>
      </nav>

      <div class="nav-foot">
        <span class="foot-dot" id="foot-dot"></span>
        <span id="foot-text">watching runs</span>
      </div>
    </aside>

    <div class="main-wrap">
      <header class="topbar">
        <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
        <div class="topbar-right">
          <div class="conn" id="conn" title="Active runs"></div>
        </div>
      </header>
      <main id="view"></main>
    </div>
  </div>
  <script src="/app.js"></script>
