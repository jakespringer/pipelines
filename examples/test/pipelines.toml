[project]
name = "test"

[config]
# These defaults make the example runnable without external services.
# A relative input_dir is resolved against this example's directory (see
# artifacts.py), so the example runs from any working directory.
input_dir = "data"
document_names = ["alpha", "beta", "gamma"]
text_case_modes = ["lower", "upper"]
remove_words = ["the", "and"]
min_lengths = [1, 5]
preview_prefix = "[test-preview]"

# Replace remote_store with a gs:// URI in the system TOML overlay to exercise
# the ordinary artifact upload/retrieve path against Google Cloud Storage.
remote_store = "gs://cmu-gpucloud-jspringe/pipelines-test/store"
local_index_store = "file:///tmp/pipelines-test/local-index-store"
base_path = "/tmp/pipelines-test/work"
