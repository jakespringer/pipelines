[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pipelines"
version = "0.1.0"
description = "Describe experiments as Artifacts and run their dependency graph, locally or on a cluster."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jake Springer" }]
keywords = ["experiments", "pipeline", "dataflow", "dependency-graph", "ml"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
]
# Core is pure standard library (Python >= 3.11 for `tomllib`).
dependencies = []

[project.optional-dependencies]
gs = ["google-cloud-storage"]  # gs:// store backend
hf = ["huggingface_hub"]       # source.hf(...) external retrieval
analysis = ["pandas"]          # gather(...).to_frame()
all = ["google-cloud-storage", "huggingface_hub", "pandas"]

[project.scripts]
pipelines = "pipelines.cli:main"     # also: python -m pipelines.worker (cluster worker)

[tool.setuptools.packages.find]
include = ["pipelines*"]
